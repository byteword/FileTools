<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="680" viewBox="0 0 1180 680" role="img" aria-labelledby="title desc">
  <title id="title">FileTools rename review dialog</title>
  <desc id="desc">Current rename review dialog with item grid, selected-row editor, extracted parts, tokens, common phrases, issue navigation, skip, rule trace, and apply controls.</desc>
  <defs>
    <style>
      .bg { fill: #f6f7f9; }
      .panel { fill: #ffffff; stroke: #d7dbe2; stroke-width: 1; }
      .grid { fill: #fbfcfd; stroke: #c7ccd2; stroke-width: 1; }
      .header { fill: #eef2f6; stroke: #c7ccd2; stroke-width: 1; }
      .input { fill: #ffffff; stroke: #bfc6d1; stroke-width: 1; }
      .button { fill: #f9fafb; stroke: #c8ced8; stroke-width: 1; }
      .primary { fill: #2563eb; stroke: #1d4ed8; stroke-width: 1; }
      .chip { fill: #eef2f7; stroke: #cfd6e1; stroke-width: 1; }
      .review { fill: #fff9db; stroke: #e9d68e; stroke-width: 1; }
      .conflict { fill: #fdf4f4; stroke: #e5b3b3; stroke-width: 1; }
      .title { fill: #20242a; font: 16px "Segoe UI", Arial, sans-serif; font-weight: 700; }
      .label { fill: #1f2937; font: 13px "Segoe UI", Arial, sans-serif; font-weight: 600; }
      .body { fill: #20242a; font: 13px "Segoe UI", Arial, sans-serif; }
      .small { fill: #68707c; font: 12px "Segoe UI", Arial, sans-serif; }
      .mono { fill: #20242a; font: 13px Consolas, monospace; }
      .primaryText { fill: #ffffff; font: 13px "Segoe UI", Arial, sans-serif; font-weight: 600; }
    </style>
  </defs>

  <rect class="bg" width="1180" height="680"/>
  <rect class="panel" x="12" y="12" width="1156" height="656" rx="4"/>
  <text class="title" x="28" y="36">이름변경 검토</text>
  <text class="title" x="676" y="36">전체 12 · 변경 10 · 검토 3 · 충돌 1 · 해결 2</text>

  <rect class="panel" x="24" y="58" width="382" height="562" rx="3"/>
  <text class="label" x="38" y="82">항목</text>
  <rect class="grid" x="38" y="94" width="352" height="506"/>
  <rect class="header" x="38" y="94" width="352" height="28"/>
  <text class="small" x="50" y="112">상태</text>
  <text class="small" x="126" y="112">원본 이름</text>
  <text class="small" x="266" y="112">새 이름</text>
  <rect class="conflict" x="40" y="124" width="348" height="58"/>
  <text class="body" x="50" y="148">충돌</text>
  <text class="body" x="112" y="148">작품 제목 12화.zip</text>
  <text class="small" x="112" y="168">작품 제목 12화 (2).zip</text>
  <rect class="review" x="40" y="184" width="348" height="58"/>
  <text class="body" x="50" y="208">검토</text>
  <text class="body" x="112" y="208">ㅇr이돌 ep 03.zip</text>
  <text class="small" x="112" y="228">아이돌 03화.zip</text>

  <rect class="panel" x="418" y="58" width="738" height="562" rx="3"/>
  <text class="label" x="432" y="82">선택 항목</text>
  <text class="label" x="432" y="116">원본 이름</text>
  <rect class="input" x="520" y="96" width="348" height="32" rx="3"/>
  <text class="mono" x="532" y="117">ㅇr이돌 ep 03 [번역].zip</text>
  <rect class="button" x="886" y="96" width="132" height="32" rx="4"/>
  <text class="body" x="915" y="117">원본 사용</text>
  <text class="label" x="432" y="158">새 이름</text>
  <rect class="input" x="520" y="138" width="348" height="32" rx="3"/>
  <text class="mono" x="532" y="159">아이돌 03화 [번역].zip</text>
  <rect class="button" x="886" y="138" width="132" height="32" rx="4"/>
  <text class="body" x="903" y="159">자동 이름 사용</text>
  <text class="small" x="520" y="194">검토 필요: 왜곡 한글 복원 후보를 확인하세요.</text>

  <rect class="panel" x="432" y="218" width="704" height="142" rx="3"/>
  <text class="label" x="448" y="241">추출된 구성요소</text>
  <rect class="input" x="448" y="282" width="280" height="30" rx="3"/>
  <text class="body" x="460" y="302">아이돌</text>
  <rect class="input" x="748" y="282" width="104" height="30" rx="3"/>
  <text class="body" x="760" y="302">03화</text>
  <rect class="input" x="872" y="282" width="146" height="30" rx="3"/>
  <text class="small" x="884" y="302">비어 있음</text>
  <rect class="input" x="1040" y="282" width="78" height="30" rx="3"/>
  <text class="body" x="1058" y="302">.zip</text>

  <rect class="panel" x="432" y="374" width="704" height="120" rx="3"/>
  <text class="label" x="448" y="397">원본/후보 삽입</text>
  <rect class="chip" x="448" y="414" width="86" height="28" rx="14"/>
  <text class="body" x="468" y="433">ㅇr이돌</text>
  <rect class="chip" x="542" y="414" width="78" height="28" rx="14"/>
  <text class="body" x="562" y="433">아이돌</text>
  <rect class="chip" x="628" y="414" width="76" height="28" rx="14"/>
  <text class="body" x="648" y="433">ep 03</text>

  <rect class="panel" x="432" y="508" width="704" height="72" rx="3"/>
  <text class="label" x="448" y="530">자주 쓰는 문구</text>
  <rect class="chip" x="448" y="542" width="70" height="26" rx="13"/>
  <text class="body" x="466" y="560">아이돌</text>
  <rect class="button" x="736" y="542" width="74" height="26" rx="4"/>
  <text class="body" x="754" y="560">더보기</text>

  <rect class="button" x="24" y="632" width="112" height="32" rx="4"/>
  <text class="body" x="54" y="653">다음 문제</text>
  <rect class="button" x="146" y="632" width="86" height="32" rx="4"/>
  <text class="body" x="169" y="653">건너뛰기</text>
  <rect class="button" x="242" y="632" width="104" height="32" rx="4"/>
  <text class="body" x="270" y="653">규칙 내역</text>
  <rect class="button" x="950" y="632" width="96" height="32" rx="4"/>
  <text class="body" x="977" y="653">취소</text>
  <rect class="primary" x="1056" y="632" width="96" height="32" rx="4"/>
  <text class="primaryText" x="1085" y="653">적용</text>
</svg>
