<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" role="img" aria-labelledby="title desc">
  <title id="title">Current settings dialog layout</title>
  <desc id="desc">Current FileTools settings dialog with status header, scrollable collapsible settings groups, ContextMenu command sections, Windows 11 native context menu actions, and fixed OK/Cancel buttons.</desc>
  <defs>
    <style>
      .bg { fill: #f4f6f8; }
      .dialog { fill: #ffffff; stroke: #aeb7c2; stroke-width: 1; }
      .panel { fill: #ffffff; stroke: #c8d0da; stroke-width: 1; }
      .status { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
      .scroll { fill: #f4f6f8; stroke: #d9e0e8; stroke-width: 1; }
      .group { fill: #ffffff; stroke-width: 2; }
      .ctxHeader { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .renameHeader { fill: #d1fae5; stroke: #059669; stroke-width: 2; }
      .folderHeader { fill: #ffedd5; stroke: #d97706; stroke-width: 2; }
      .relocateHeader { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2; }
      .input { fill: #ffffff; stroke: #bfc6d1; stroke-width: 1; }
      .button { fill: #f9fafb; stroke: #c8ced8; stroke-width: 1; }
      .title { fill: #18212f; font: 18px "Segoe UI", Arial, sans-serif; font-weight: 700; }
      .label { fill: #1f2937; font: 13px "Segoe UI", Arial, sans-serif; font-weight: 600; }
      .body { fill: #1f2937; font: 13px "Segoe UI", Arial, sans-serif; }
      .small { fill: #64748b; font: 12px "Segoe UI", Arial, sans-serif; }
      .muted { fill: #475569; font: 12px "Segoe UI", Arial, sans-serif; }
    </style>
  </defs>

  <rect class="bg" width="900" height="720"/>
  <rect class="dialog" x="1" y="1" width="898" height="718"/>
  <text class="title" x="24" y="34">설정</text>

  <rect class="status" x="24" y="50" width="852" height="92"/>
  <text class="label" x="42" y="76">설정 상태</text>
  <text class="body" x="42" y="101">Explorer 메뉴가 등록되어 있습니다. 선택된 명령은 8개입니다.</text>
  <text class="small" x="42" y="124">OK를 누르면 설정 저장과 현재 셸 메뉴 상태 적용을 함께 수행합니다: 등록됨.</text>

  <rect class="scroll" x="24" y="154" width="852" height="508"/>
  <text class="small" x="42" y="176">스크롤 영역: 그룹을 펼치거나 접어서 설정 범위를 스캔</text>

  <rect class="group" x="42" y="190" width="816" height="382" stroke="#2563eb"/>
  <rect class="ctxHeader" x="42" y="190" width="816" height="40"/>
  <text class="label" x="60" y="215">v  ContextMenu</text>
  <text class="muted" x="706" y="215" fill="#1d4ed8">등록됨 · 8개 활성</text>

  <rect x="62" y="248" width="14" height="14" fill="#ffffff" stroke="#7c8796"/>
  <path d="M64 254 L69 260 L77 248" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text class="body" x="86" y="261">Explorer ContextMenu 등록</text>
  <text class="small" x="86" y="283">등록을 꺼도 아래 명령 선택값은 저장됩니다.</text>

  <text class="body" x="62" y="316">메뉴 방식</text>
  <rect class="input" x="190" y="298" width="350" height="28" rx="3"/>
  <text class="body" x="204" y="317">FileTools 하위 메뉴</text>

  <text class="label" x="62" y="354">Context Menu 작업</text>
  <rect x="62" y="370" width="12" height="12" fill="#ffffff" stroke="#7c8796"/>
  <path d="M64 376 L68 381 L75 369" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text class="body" x="84" y="382">파일이름 자동 교정</text>

  <text class="label" x="300" y="354">폴더 씌우기 / 벗기기</text>
  <rect x="300" y="370" width="12" height="12" fill="#ffffff" stroke="#7c8796"/>
  <path d="M302 376 L306 381 L313 369" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text class="body" x="322" y="382">감싸기</text>
  <rect x="300" y="394" width="12" height="12" fill="#ffffff" stroke="#7c8796"/>
  <path d="M302 400 L306 405 L313 393" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text class="body" x="322" y="406">같은 이름 단일 파일 폴더 벗기기</text>
  <rect x="300" y="418" width="12" height="12" fill="#ffffff" stroke="#7c8796"/>
  <path d="M302 424 L306 429 L313 417" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text class="body" x="322" y="430">바로 아래 자식 파일 상위 이동</text>

  <text class="label" x="560" y="354">자동 재배치</text>
  <rect x="560" y="370" width="12" height="12" fill="#ffffff" stroke="#7c8796"/>
  <path d="M562 376 L566 381 L573 369" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text class="body" x="582" y="382">현재 폴더 기준</text>
  <rect x="560" y="394" width="12" height="12" fill="#ffffff" stroke="#7c8796"/>
  <path d="M562 400 L566 405 L573 393" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text class="body" x="582" y="406">대상 폴더 선택</text>

  <text class="label" x="62" y="462">앱 실행 명령</text>
  <rect x="62" y="478" width="12" height="12" fill="#ffffff" stroke="#7c8796"/>
  <path d="M64 484 L68 489 L75 477" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text class="body" x="84" y="490">FileTools 열기</text>
  <rect class="button" x="300" y="470" width="148" height="30" rx="4"/>
  <text class="body" x="337" y="490">메뉴 설치</text>
  <rect class="button" x="462" y="470" width="148" height="30" rx="4"/>
  <text class="body" x="499" y="490">메뉴 제거</text>

  <text class="label" x="62" y="520">Windows 11 기본 메뉴</text>
  <text class="small" x="190" y="520">MSIX 인증서 신뢰와 sparse package identity 등록/제거</text>
  <rect class="button" x="62" y="528" width="180" height="30" rx="4"/>
  <text class="body" x="104" y="548">Windows 11 메뉴 등록</text>
  <rect class="button" x="254" y="528" width="180" height="30" rx="4"/>
  <text class="body" x="296" y="548">Windows 11 메뉴 제거</text>

  <rect class="group" x="42" y="582" width="816" height="40" stroke="#059669"/>
  <rect class="renameHeader" x="42" y="582" width="816" height="40"/>
  <text class="label" x="60" y="607">v  이름변경</text>
  <text class="muted" x="626" y="607" fill="#047857">항상 검토 · 사전 사용 · 규칙 편집</text>

  <rect class="group" x="42" y="626" width="816" height="40" stroke="#d97706"/>
  <rect class="folderHeader" x="42" y="626" width="816" height="40"/>
  <text class="label" x="60" y="651">&gt;  폴더 씌우기 / 벗기기</text>
  <text class="muted" x="650" y="651" fill="#b45309">자동 · 파일명 유지</text>

  <rect class="group" x="42" y="670" width="520" height="34" stroke="#7c3aed"/>
  <rect class="relocateHeader" x="42" y="670" width="520" height="34"/>
  <text class="label" x="60" y="692">&gt;  자동 재배치</text>
  <text class="muted" x="364" y="692" fill="#6d28d9">Default template</text>

  <rect class="button" x="666" y="676" width="94" height="30" rx="3"/>
  <text class="body" x="704" y="696">OK</text>
  <rect class="button" x="772" y="676" width="94" height="30" rx="3"/>
  <text class="body" x="802" y="696">취소</text>
</svg>
