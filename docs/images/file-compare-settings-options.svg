<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="840" viewBox="0 0 1160 840" role="img" aria-labelledby="title desc">
  <title id="title">File compare settings layout</title>
  <desc id="desc">Wireframe for grouped FileTools file comparison options, including common-name matching, range units, and archive extraction sub-options.</desc>
  <rect width="1160" height="840" fill="#f4f6f8"/>
  <rect x="40" y="30" width="1080" height="780" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="72" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">File compare settings</text>
  <text x="72" y="106" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#64748b">Grouped controls with dependent fields disabled when their parent checkbox or mode is off.</text>

  <g transform="translate(72 138)">
    <rect width="500" height="190" rx="6" fill="#eef6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="20" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1e3a8a">File name</text>
    <rect x="20" y="58" width="18" height="18" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <path d="M24 67 L29 72 L36 62" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="50" y="73" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111827">Compare file name</text>
    <text x="20" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">Name match mode</text>
    <rect x="180" y="91" width="275" height="34" rx="4" fill="#ffffff" stroke="#94a3b8"/>
    <text x="196" y="113" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">Common name overlap</text>
    <text x="20" y="151" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">Threshold</text>
    <rect x="180" y="132" width="150" height="34" rx="4" fill="#ffffff" stroke="#94a3b8"/>
    <text x="196" y="154" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">Min percent</text>
    <rect x="344" y="132" width="111" height="34" rx="4" fill="#ffffff" stroke="#94a3b8"/>
    <text x="388" y="154" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">70</text>
  </g>

  <g transform="translate(616 138)">
    <rect width="472" height="190" rx="6" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
    <text x="20" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#7c2d12">Metadata</text>
    <rect x="20" y="58" width="18" height="18" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <text x="50" y="73" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111827">Created time</text>
    <rect x="20" y="95" width="18" height="18" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <path d="M24 104 L29 109 L36 99" fill="none" stroke="#d97706" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="50" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111827">Modified time</text>
    <rect x="220" y="95" width="18" height="18" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <path d="M224 104 L229 109 L236 99" fill="none" stroke="#d97706" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="250" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111827">File size</text>
  </g>

  <g transform="translate(72 358)">
    <rect width="1016" height="310" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="20" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#065f46">Content</text>
    <rect x="20" y="58" width="18" height="18" rx="3" fill="#ffffff" stroke="#059669" stroke-width="2"/>
    <path d="M24 67 L29 72 L36 62" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="50" y="73" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111827">Compare content</text>

    <text x="20" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">Mode</text>
    <rect x="130" y="93" width="190" height="34" rx="4" fill="#ffffff" stroke="#94a3b8"/>
    <text x="146" y="115" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">Byte-to-byte</text>
    <text x="350" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">Range</text>
    <rect x="450" y="93" width="190" height="34" rx="4" fill="#ffffff" stroke="#94a3b8"/>
    <text x="466" y="115" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">Middle part</text>
    <text x="670" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">Start</text>
    <rect x="720" y="93" width="90" height="34" rx="4" fill="#ffffff" stroke="#94a3b8"/>
    <text x="746" y="115" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">512</text>
    <text x="830" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">Length</text>
    <rect x="888" y="93" width="72" height="34" rx="4" fill="#ffffff" stroke="#94a3b8"/>
    <text x="910" y="115" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">1</text>
    <rect x="966" y="93" width="40" height="34" rx="4" fill="#ffffff" stroke="#94a3b8"/>
    <text x="976" y="115" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">MiB</text>

    <g transform="translate(20 156)">
      <rect width="976" height="128" rx="6" fill="#f0fdf4" stroke="#86efac"/>
      <text x="14" y="28" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#166534">Archive extraction comparison</text>
      <rect x="14" y="48" width="18" height="18" rx="3" fill="#ffffff" stroke="#059669" stroke-width="2"/>
      <path d="M18 57 L23 62 L30 52" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="44" y="63" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">Extract ZIP entries before content comparison</text>
      <text x="420" y="63" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">Order</text>
      <rect x="470" y="44" width="160" height="34" rx="4" fill="#ffffff" stroke="#94a3b8"/>
      <text x="486" y="66" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">Filename order</text>
      <text x="650" y="63" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">Scope</text>
      <rect x="704" y="44" width="118" height="34" rx="4" fill="#ffffff" stroke="#94a3b8"/>
      <text x="716" y="66" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">First N</text>
      <rect x="834" y="44" width="58" height="34" rx="4" fill="#ffffff" stroke="#94a3b8"/>
      <text x="856" y="66" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">5</text>
      <rect x="14" y="90" width="18" height="18" rx="3" fill="#ffffff" stroke="#059669" stroke-width="2"/>
      <path d="M18 99 L23 104 L30 94" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="44" y="105" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">Compare only entries with the same relative path</text>
    </g>
  </g>

  <g transform="translate(72 700)">
    <rect width="1016" height="76" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="20" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#334155">Other options</text>
    <rect x="20" y="48" width="18" height="18" rx="3" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <path d="M24 57 L29 62 L36 52" fill="none" stroke="#64748b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="50" y="63" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111827">Early exit</text>
    <rect x="190" y="48" width="18" height="18" rx="3" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <path d="M194 57 L199 62 L206 52" fill="none" stroke="#64748b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="220" y="63" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111827">Use run hash cache</text>
    <text x="450" y="63" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#64748b">Byte prefilter: 10%</text>
  </g>
</svg>
