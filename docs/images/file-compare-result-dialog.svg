<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
  <title id="title">File compare result dialog layout</title>
  <desc id="desc">Wireframe for the FileTools file comparison result dialog with summary, filter, pair grid, and detail grid.</desc>
  <rect width="1100" height="760" fill="#f4f6f8"/>
  <rect x="40" y="30" width="1020" height="700" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="72" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">File compare results</text>
  <text x="72" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#64748b">Summary counts, status filtering, sortable pair rows, and per-criterion details.</text>

  <g transform="translate(72 136)">
    <text x="0" y="24" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#111827">Targets 6 / Pairs 15 / Same 4 / Different 8 / Partial 2 / Failed 1 / Cache 12 hits, 6 misses</text>
    <text x="696" y="24" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">Status</text>
    <rect x="752" y="0" width="204" height="34" rx="4" fill="#ffffff" stroke="#94a3b8"/>
    <text x="768" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">All results</text>
  </g>

  <g transform="translate(72 196)">
    <rect width="956" height="330" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <rect width="956" height="36" fill="#e2e8f0"/>
    <text x="18" y="23" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#111827">Status</text>
    <text x="132" y="23" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#111827">Match</text>
    <text x="236" y="23" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#111827">Left</text>
    <text x="530" y="23" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#111827">Right</text>
    <text x="775" y="23" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#111827">Reason</text>

    <g transform="translate(0 36)">
      <rect width="956" height="40" fill="#ecfdf5"/>
      <text x="18" y="25" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#065f46">Same</text>
      <text x="132" y="25" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">100%</text>
      <text x="236" y="25" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">C:\Photos\a.jpg</text>
      <text x="530" y="25" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">D:\Backup\a.jpg</text>
      <text x="775" y="25" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">All selected criteria match.</text>
    </g>

    <g transform="translate(0 76)">
      <rect width="956" height="40" fill="#f8fafc"/>
      <text x="18" y="25" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#334155">Different</text>
      <text x="132" y="25" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">0%</text>
      <text x="236" y="25" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">C:\Photos\b.png</text>
      <text x="530" y="25" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">D:\Backup\b.png</text>
      <text x="775" y="25" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">Leading prefilter differs.</text>
    </g>

    <g transform="translate(0 116)">
      <rect width="956" height="40" fill="#fffbeb"/>
      <text x="18" y="25" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#92400e">Partial</text>
      <text x="132" y="25" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">72.3%</text>
      <text x="236" y="25" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">C:\Photos\scan.zip</text>
      <text x="530" y="25" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">D:\Backup\scan.zip</text>
      <text x="775" y="25" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">ZIP entries partially match.</text>
    </g>

    <g transform="translate(0 156)">
      <rect width="956" height="40" fill="#fef2f2"/>
      <text x="18" y="25" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#991b1b">Failed</text>
      <text x="132" y="25" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">0%</text>
      <text x="236" y="25" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">C:\Photos\locked.bin</text>
      <text x="530" y="25" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">D:\Backup\locked.bin</text>
      <text x="775" y="25" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">Access denied.</text>
    </g>

    <line x1="112" y1="0" x2="112" y2="330" stroke="#cbd5e1"/>
    <line x1="212" y1="0" x2="212" y2="330" stroke="#cbd5e1"/>
    <line x1="510" y1="0" x2="510" y2="330" stroke="#cbd5e1"/>
    <line x1="758" y1="0" x2="758" y2="330" stroke="#cbd5e1"/>
  </g>

  <g transform="translate(72 552)">
    <rect width="956" height="124" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <rect width="956" height="34" fill="#e2e8f0"/>
    <text x="18" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#111827">Criterion</text>
    <text x="190" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#111827">Status</text>
    <text x="304" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#111827">Match</text>
    <text x="420" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#111827">Detail</text>

    <rect y="34" width="956" height="34" fill="#ecfdf5"/>
    <text x="18" y="56" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">File size</text>
    <text x="190" y="56" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#065f46">Same</text>
    <text x="304" y="56" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">100%</text>
    <text x="420" y="56" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">Both files are 14,328,912 bytes.</text>

    <rect y="68" width="956" height="34" fill="#f8fafc"/>
    <text x="18" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">Content</text>
    <text x="190" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#334155">Different</text>
    <text x="304" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">0%</text>
    <text x="420" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">Byte-to-byte prefilter hash differs in the selected range.</text>

    <line x1="170" y1="0" x2="170" y2="124" stroke="#cbd5e1"/>
    <line x1="284" y1="0" x2="284" y2="124" stroke="#cbd5e1"/>
    <line x1="400" y1="0" x2="400" y2="124" stroke="#cbd5e1"/>
  </g>

  <rect x="932" y="688" width="96" height="30" rx="4" fill="#2563eb"/>
  <text x="963" y="708" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#ffffff">Close</text>
</svg>
