<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Rename pattern learning settings</title>
  <desc id="desc">Settings window concept showing the personal pattern learning toggle and feedback row limit.</desc>
  <defs>
    <style>
      .bg { fill: #f4f6f8; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
      .header { fill: #ecfdf5; stroke: #10b981; stroke-width: 1; }
      .section { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
      .title { font: 700 17px Segoe UI, Arial, sans-serif; fill: #064e3b; }
      .body { font: 14px Segoe UI, Arial, sans-serif; fill: #111827; }
      .muted { font: 12px Segoe UI, Arial, sans-serif; fill: #64748b; }
      .label { font: 13px Segoe UI, Arial, sans-serif; fill: #374151; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
      .check { fill: #059669; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="900" height="420" />
  <rect class="panel" x="36" y="28" width="828" height="356" rx="6" />
  <rect class="header" x="58" y="52" width="784" height="52" rx="4" />
  <text class="title" x="78" y="84">이름변경</text>
  <text class="muted" x="78" y="124">검토 모드, 사전, 개인 패턴 학습, 교정 플러그인을 한 그룹에서 관리합니다.</text>

  <text class="label" x="78" y="162">개인 패턴 학습</text>
  <rect class="section" x="78" y="180" width="744" height="126" rx="4" />
  <text class="muted" x="100" y="207">확정한 이름변경 패턴 선택을 로컬에 저장해 이후 후보 순서가 선호 구조에 맞게 정렬되도록 준비합니다.</text>

  <rect class="box" x="100" y="226" width="18" height="18" rx="2" />
  <path class="check" d="M104 235 l4 4 l8 -10 l3 3 l-11 13 l-7 -7 z" />
  <text class="body" x="130" y="240">개인 이름변경 패턴 학습 사용</text>

  <text class="label" x="100" y="276">최대 이력 행 수</text>
  <rect class="box" x="250" y="257" width="150" height="28" rx="3" />
  <text class="body" x="264" y="276">2000</text>
  <text class="muted" x="420" y="276">제한을 넘으면 오래된 항목부터 정리합니다. 최소값은 100입니다.</text>

  <text class="label" x="78" y="342">저장 위치</text>
  <text class="muted" x="160" y="342">%APPDATA%\FileTools\rename-pattern-feedback.jsonl</text>
</svg>
