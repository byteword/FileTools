<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">File kind classification editor</title>
  <desc id="desc">AutoRelocation file kind classification editor with file kind add, rename, delete, extension editing, and registered extension lookup.</desc>
  <defs>
    <style>
      .bg { fill: #f6f7f9; }
      .panel { fill: #ffffff; stroke: #d7dbe2; stroke-width: 1; }
      .input { fill: #ffffff; stroke: #bfc6d1; stroke-width: 1; }
      .button { fill: #f9fafb; stroke: #c8ced8; stroke-width: 1; }
      .selected { fill: #eef6ff; stroke: #93c5fd; stroke-width: 1; }
      .status { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1; }
      .title { fill: #20242a; font: 18px "Segoe UI", Arial, sans-serif; font-weight: 700; }
      .label { fill: #1f2937; font: 13px "Segoe UI", Arial, sans-serif; font-weight: 600; }
      .body { fill: #20242a; font: 13px "Segoe UI", Arial, sans-serif; }
      .small { fill: #68707c; font: 12px "Segoe UI", Arial, sans-serif; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="520"/>
  <rect class="panel" x="40" y="28" width="840" height="464" rx="4"/>
  <text class="title" x="68" y="62">파일 종류 분류</text>
  <text class="small" x="68" y="88">KnownFileKind 확장자 규칙과 사용자 정의 파일 종류를 관리</text>

  <rect class="panel" x="68" y="112" width="230" height="326" rx="3"/>
  <text class="label" x="86" y="140">파일 종류</text>
  <rect class="selected" x="86" y="158" width="194" height="32" rx="2"/>
  <text class="body" x="102" y="179">Image</text>
  <rect x="86" y="198" width="194" height="32" fill="#ffffff" stroke="#d7dbe2"/>
  <text class="body" x="102" y="219">Video</text>
  <rect x="86" y="238" width="194" height="32" fill="#ffffff" stroke="#d7dbe2"/>
  <text class="body" x="102" y="259">Document</text>
  <rect x="86" y="278" width="194" height="32" fill="#ffffff" stroke="#d7dbe2"/>
  <text class="body" x="102" y="299">새 파일 종류</text>

  <text class="label" x="86" y="342">대표 이름</text>
  <rect class="input" x="86" y="354" width="194" height="30" rx="3"/>
  <text class="body" x="102" y="374">Image</text>
  <rect class="button" x="86" y="398" width="56" height="30" rx="4"/>
  <text class="body" x="104" y="418">추가</text>
  <rect class="button" x="150" y="398" width="76" height="30" rx="4"/>
  <text class="body" x="164" y="418">이름 변경</text>
  <rect class="button" x="234" y="398" width="46" height="30" rx="4"/>
  <text class="body" x="244" y="418">삭제</text>

  <text class="label" x="330" y="140">확장자</text>
  <rect class="input" x="330" y="158" width="522" height="104" rx="3"/>
  <text class="body" x="348" y="184">.jpg</text>
  <text class="body" x="348" y="208">.png</text>
  <text class="body" x="348" y="232">.webp</text>

  <text class="label" x="330" y="296">시스템 등록 확장자</text>
  <rect class="input" x="330" y="312" width="522" height="30" rx="3"/>
  <text class="small" x="348" y="332">확장자 또는 설명 검색</text>
  <rect class="panel" x="330" y="354" width="522" height="84" rx="3"/>
  <text class="body" x="348" y="382">.avif    AVIF image</text>
  <text class="body" x="348" y="410">.heic    HEIC image</text>
  <rect class="button" x="330" y="452" width="122" height="30" rx="4"/>
  <text class="body" x="350" y="472">확장자 추가</text>

  <rect class="status" x="470" y="452" width="382" height="30" rx="3"/>
  <text class="small" x="488" y="472">추가/삭제/이름 변경 결과를 인라인 상태로 표시</text>
</svg>
