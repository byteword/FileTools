<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc">
  <title id="title">Common filename archive merge preview mockup</title>
  <desc id="desc">A dialog mockup showing selected ZIP archives, the calculated common output name, archive merge options, and a detailed internal file list with collision-renamed target entries.</desc>
  <defs>
    <style>
      .bg { fill: #f6f8fb; }
      .window { fill: #ffffff; stroke: #9aa8b5; stroke-width: 2; }
      .bar { fill: #e8eef5; }
      .panel { fill: #ffffff; stroke: #c7d0d9; stroke-width: 1.5; }
      .muted { fill: #5c6670; font-family: Segoe UI, Arial, sans-serif; font-size: 18px; }
      .text { fill: #1f2933; font-family: Segoe UI, Arial, sans-serif; font-size: 20px; }
      .title { fill: #111827; font-family: Segoe UI, Arial, sans-serif; font-size: 26px; font-weight: 600; }
      .small { fill: #334155; font-family: Segoe UI, Arial, sans-serif; font-size: 16px; }
      .tiny { fill: #334155; font-family: Segoe UI, Arial, sans-serif; font-size: 14px; }
      .button { fill: #f8fafc; stroke: #aeb8c2; stroke-width: 1.5; }
      .primary { fill: #2563eb; stroke: #1d4ed8; stroke-width: 1.5; }
      .primaryText { fill: #ffffff; font-family: Segoe UI, Arial, sans-serif; font-size: 18px; font-weight: 600; }
      .field { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
      .tableHead { fill: #dbeafe; }
      .ready { fill: #ecfdf5; stroke: #a7f3d0; stroke-width: 1; }
      .warn { fill: #fffbeb; stroke: #fde68a; stroke-width: 1; }
      .line { stroke: #d3dce6; stroke-width: 1; }
      .chip { fill: #eef2ff; stroke: #c7d2fe; stroke-width: 1; }
      .arrow { stroke: #2563eb; stroke-width: 4; fill: none; marker-end: url(#arrowHead); }
      .archive { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; }
    </style>
    <marker id="arrowHead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1120" height="760"/>
  <rect class="window" x="70" y="40" width="980" height="680" rx="8"/>
  <rect class="bar" x="72" y="42" width="976" height="70" rx="6"/>
  <text class="title" x="100" y="86">Merge Archives by Common Filename</text>
  <text class="muted" x="728" y="84">2 ZIPs | 184 entries | output A.zip</text>

  <rect class="panel" x="100" y="136" width="920" height="132" rx="6"/>
  <text class="text" x="124" y="172">Output stem</text>
  <rect class="field" x="250" y="146" width="270" height="42" rx="4"/>
  <text class="text" x="266" y="175">A</text>
  <rect class="chip" x="540" y="146" width="190" height="42" rx="21"/>
  <text class="small" x="572" y="173">Common logical name</text>
  <text class="text" x="124" y="228">Output path</text>
  <rect class="field" x="250" y="202" width="580" height="42" rx="4"/>
  <text class="small" x="270" y="229">C:\Work\A.zip</text>
  <rect class="button" x="850" y="202" width="144" height="42" rx="4"/>
  <text class="small" x="892" y="229">Browse</text>

  <rect class="archive" x="148" y="304" width="170" height="60" rx="6"/>
  <text class="text" x="178" y="340">A 01.zip</text>
  <rect class="archive" x="148" y="382" width="170" height="60" rx="6"/>
  <text class="text" x="178" y="418">A 02.zip</text>
  <line class="arrow" x1="344" y1="374" x2="520" y2="374"/>
  <rect class="archive" x="552" y="326" width="180" height="92" rx="8"/>
  <text class="title" x="606" y="380">A.zip</text>
  <text class="small" x="580" y="406">verified temp output</text>

  <rect class="panel" x="770" y="296" width="250" height="154" rx="6"/>
  <text class="text" x="792" y="328">Archive policy</text>
  <text class="small" x="792" y="364">Layout: Preserve paths</text>
  <text class="small" x="792" y="394">Collision: Auto-number</text>
  <text class="small" x="792" y="424">Duplicates: Keep both</text>

  <rect class="panel" x="100" y="478" width="920" height="154" rx="6"/>
  <text class="text" x="124" y="510">Detailed file list</text>
  <text class="muted" x="738" y="510">1 collision renamed | 0 blocked</text>
  <rect class="tableHead" x="101" y="524" width="918" height="32" rx="5"/>
  <text class="tiny" x="124" y="545">Source archive</text>
  <text class="tiny" x="286" y="545">Original entry</text>
  <text class="tiny" x="520" y="545">Target entry</text>
  <text class="tiny" x="794" y="545">Status</text>
  <line class="line" x1="264" y1="524" x2="264" y2="632"/>
  <line class="line" x1="500" y1="524" x2="500" y2="632"/>
  <line class="line" x1="772" y1="524" x2="772" y2="632"/>

  <rect class="ready" x="112" y="566" width="896" height="24" rx="4"/>
  <text class="tiny" x="124" y="583">A 01.zip</text>
  <text class="tiny" x="286" y="583">page/001.jpg</text>
  <text class="tiny" x="520" y="583">page/001.jpg</text>
  <text class="tiny" x="794" y="583">Ready</text>

  <rect class="warn" x="112" y="596" width="896" height="24" rx="4"/>
  <text class="tiny" x="124" y="613">A 02.zip</text>
  <text class="tiny" x="286" y="613">page/001.jpg</text>
  <text class="tiny" x="520" y="613">page/001 (2).jpg</text>
  <text class="tiny" x="794" y="613">Collision renamed</text>

  <rect class="button" x="732" y="652" width="126" height="42" rx="4"/>
  <text class="small" x="772" y="679">Cancel</text>
  <rect class="primary" x="878" y="652" width="126" height="42" rx="4"/>
  <text class="primaryText" x="918" y="679">Merge</text>
</svg>
